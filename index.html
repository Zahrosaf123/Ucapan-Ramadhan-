<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ramadhan</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: navy;
        }

        #textContainer {
            position: absolute;
            top: 50px;
            width: 100%;
            text-align: center;
            font-family: "Georgia", serif;
            pointer-events: none;
        }

        #textContainer h1 {
            font-size: 42px;
            margin: 0;
            color: #fff4b0;
            text-shadow: 0 0 20px rgba(255, 230, 150, 0.8);

            opacity: 0;
            animation: fadeInTitle 3s ease forwards;
        }

        #textContainer p {
            font-size: 18px;
            margin-top: 12px;
            color: #ffe8a3;

            opacity: 0;
            animation: fadeInSubtitle 3s ease forwards;
            animation-delay: 2s;
            /* MUNCUL SETELAH 2 DETIK */
        }

        /* ANIMASI */
        @keyframes fadeInTitle {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInSubtitle {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div id="textContainer">
        <h1>Selamat Menunaikan Ibadah Puasa 1447 H</h1>
        <p>Semoga Bulan Ramadhan ini Menghidupkan Kembali Cahaya Iman di Hati Kita.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ================= SCENE =================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030b1f);

        // ================= CAMERA =================
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;
        camera.position.y = -1;

        // ================= RENDERER =================
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // =================================================
        // 🌙 BULAN SABIT (POJOK KIRI ATAS)
        // =================================================

        // lingkaran besar
        const bigGeo = new THREE.CircleGeometry(0.9, 64);
        const bigMat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
        const bigMoon = new THREE.Mesh(bigGeo, bigMat);
        bigMoon.position.set(-11.5, 4.5, 0);
        scene.add(bigMoon);

        // lingkaran kecil (untuk potong jadi sabit)
        const smallGeo = new THREE.CircleGeometry(0.9, 64);
        const smallMat = new THREE.MeshBasicMaterial({ color: 0x030b1f });
        const smallMoon = new THREE.Mesh(smallGeo, smallMat);

        // ⬅️ potong sedikit ke kanan saja (X beda sedikit)
        // Y HARUS SAMA biar rapi
        smallMoon.position.set(-10.8, 4.5, 0.01);
        scene.add(smallMoon);

        // =================================================
        // ⭐ BINTANG
        // =================================================
        const twinkleStars = [];

        function createStar() {
            const geo = new THREE.SphereGeometry(0.08, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xfff4b0, transparent: true, opacity: 1 });
            return new THREE.Mesh(geo, mat);
        }

        // Loop bintang
        for (let i = 0; i < 1200; i++) {
            const star = createStar();
            star.position.x = (Math.random() - 0.5) * 50;
            star.position.y = -5 + Math.random() * 35;  // tetap ada sedikit di atas tanah
            star.position.z = (Math.random() - 0.5) * 50;
            scene.add(star);
            if (Math.random() > 0.3) twinkleStars.push(star);
        }

        // === TANAH / HORIZON ===
        const groundGeometry = new THREE.PlaneGeometry(50, 3);
        const groundMaterial = new THREE.MeshBasicMaterial({ color: 0x020617 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.position.y = -6;
        ground.position.z = -1;
        scene.add(ground);

        // =================================================
        // 🕌 MASJID (IMAGE PNG)
        // =================================================

        const textureLoader = new THREE.TextureLoader();

        const masjidTexture = textureLoader.load("masjid.png");

        const masjidMaterial = new THREE.SpriteMaterial({
            map: masjidTexture,
            transparent: true
        });

        const masjid = new THREE.Sprite(masjidMaterial);

        // ukuran masjid (atur kalau mau lebih besar/kecil)
        masjid.scale.set(8.5, 7.8, 1);

        // posisi di kanan dan di atas tanah
        masjid.position.x = 8;     // geser ke kanan
        masjid.position.y = -1.3;  // tepat di atas tanah
        masjid.position.z = 0;

        scene.add(masjid);

        // =================================================
        // BAYANGAN HALUS MASJID
        // =================================================

        const shadowGeometry = new THREE.CircleGeometry(4, 32);

        const shadowMaterial = new THREE.MeshBasicMaterial({
            color: 0x000000,
            transparent: true,
            opacity: 0.15
        });

        const shadow = new THREE.Mesh(shadowGeometry, shadowMaterial);

        shadow.rotation.x = -Math.PI / 2; // rebahkan ke tanah
        shadow.position.y = -5; // sedikit di atas tanah
        shadow.position.x = 8; // samakan dengan posisi masjid
        shadow.position.z = 0;

        scene.add(shadow);

        // =================================================
        // 🧕 CEWEK JALAN AL-QURAN
        // =================================================

        const girlTexture = new THREE.TextureLoader().load("cewek.png");

        const girlMaterial = new THREE.SpriteMaterial({
            map: girlTexture,
            transparent: true
        });

        const girl = new THREE.Sprite(girlMaterial);

        // ukuran (atur kalau mau lebih besar/kecil)
        girl.scale.set(2.5, 3, 1);

        // posisi awal (mulai dari kiri layar)
        girl.position.set(-12, -2.8, 0);

        scene.add(girl);

        // =================================================
        // 🎬 ANIMASI
        // =================================================
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.002;

            twinkleStars.forEach((star, i) => {
                star.material.opacity = 0.5 + Math.sin(time + i) * 0.5;
            });

            bigMoon.rotation.z += 0.002;
            smallMoon.rotation.z += 0.002;

            // === GERAKAN CEWEK JALAN ===
            girl.position.x += 0.01;

            // kalau sudah sampai kanan, ulang lagi dari kiri
            if (girl.position.x > 12) {
                girl.position.x = -12;
            }

            renderer.render(scene, camera);
        }

        animate();

        // ================= RESPONSIVE =================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>

</body>


</html>
